version: "3.9"

services:
  app:
    build: .
    container_name: stellarium_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: stellarium_db
    environment:
      POSTGRES_DB: stellarium
      POSTGRES_USER: stellarium
      POSTGRES_PASSWORD: stellarium
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stellarium_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
