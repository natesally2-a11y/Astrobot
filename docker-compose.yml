version: "3.9"

services:
  app:
    build: .
    container_name: stellarium-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: stellarium-db
    environment:
      POSTGRES_DB: stellarium
      POSTGRES_USER: stellarium
      POSTGRES_PASSWORD: stellarium
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stellarium-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pg_data:

