version: "3.9"

services:
  bot:
    build: .
    container_name: stellarium-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - stellarium-net

  db:
    image: postgres:15-alpine
    container_name: stellarium-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stellarium
      POSTGRES_USER: stellarium
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stellarium_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarium -d stellarium"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stellarium-net

  redis:
    image: redis:7-alpine
    container_name: stellarium-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stellarium-net

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: stellarium-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - bot
  #   networks:
  #     - stellarium-net

volumes:
  postgres_data:
  redis_data:

networks:
  stellarium-net:
    driver: bridge
